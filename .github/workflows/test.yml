name: test

# 什么时候跑：往 main 推、以及有人提 PR 时。
on:
  push:
    branches: [main]
  pull_request:

# 最小权限：这个 workflow 只需要读代码。
# 没给 contents: write —— 即使有人提恶意 PR，也拿不到写权限改仓库。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 刻意不跑 npm install：本插件零运行时依赖，测试只用 node 内置的 node:test。
      # CI 里最大的一类风险就是安装依赖时执行陌生脚本，不装东西就没有这个面。
      # 「确实零依赖」由测试断言（test/package-meta.test.js），不在这里写内联脚本。
      # 2026-09-20 踩过坑：内联脚本里的「冒号+空格」会让整份 YAML 解析失败，
      # 表现是 workflow 直接起不来（jobs 数为 0），而不是某一步报错 —— 很难查。
      - name: run tests
        run: node --test
